[package]
name = "builder"
version = "0.0.1"
edition = "2024"

[features]
data = []

[dependencies]
alpaca = { path = "../alpaca", features = ["packer"] }
anyhow = "1.0.100"
walkdir = "2.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
blake3 = "1.5"
log = "0.4.29"
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }
rayon = "1.11.0"
shaderc = { version = "0.10.1" }
memmap2 = "0.9.9"
gltf = { version = "1.4.1", features = ["extras"] }
rkyv = { version = "0.8.13" }
dashmap = "7.0.0-rc2"
