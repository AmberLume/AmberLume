[package]
name = "alpaca"
version = "0.0.1"
edition = "2024"

[features]
default = ["cli"]
packer = []
unpacker = ["dep:memmap2"]
compiler = ["dep:shaderc", "dep:gltf"]
walker = ["dep:walkdir"]
cli = ["packer", "unpacker", "walker", "compiler", "dep:clap"]

[dependencies]
anyhow = "1.0.100"
bincode = { version = "2", features = ["derive"] }
byteorder = "1.5.0"

memmap2 = { version = "0.9.9", optional = true }
walkdir = { version = "2.5.0", optional = true }
clap = { version = "4.5.50", features = ["derive"], optional = true }

shaderc = { version = "0.10.1", optional = true }
gltf = { version = "1.4.1", optional = true}

[lib]
path = "src/lib.rs"

[[bin]]
name = "alpaca"
path = "src/main.rs"
required-features = ["cli"]
