[package]
name = "alpaca"
version = "0.0.1"
edition = "2024"

[features]
default = ["cli"]
packer = ["dep:rkyv"]
unpacker = ["data", "dep:memmap2", "dep:rkyv"]
assembler = ["data", "dep:shaderc", "dep:gltf", "dep:meshopt", "dep:flatc-rust", "dep:bytemuck", "dep:image", "dep:tempdir"]
data = []
walker = ["dep:walkdir"]
cli = ["packer", "unpacker", "walker", "assembler", "dep:clap"]

[dependencies]
anyhow = "1.0.100"
rkyv = { version = "0.8.12", features = ["bytecheck"], optional = true }
bytemuck = { version = "1.24.0", optional = true }
byteorder = "1.5.0"
memmap2 = { version = "0.9.9", optional = true }
walkdir = { version = "2.5.0", optional = true }
clap = { version = "4.5.50", features = ["derive"], optional = true }
shaderc = { version = "0.10.1", optional = true }
gltf = { version = "1.4.1", optional = true }
meshopt = { version = "0.6.2", optional = true }
image = { version = "0.25.9", optional = true }
tempdir = { version = "0.3.7", optional = true }

[build-dependencies]
flatc-rust = { version = "0.2", optional = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "alpaca"
path = "src/main.rs"
required-features = ["cli"]
