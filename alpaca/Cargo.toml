[package]
name = "alpaca"
version = "1.0.0"
edition = "2024"

[features]
packer = ["dep:rkyv", "dep:byteorder"]
unpacker = ["dep:rkyv", "dep:byteorder", "dep:memmap2"]

[dependencies]
anyhow = { version = "1.0.100", optional = false }
rkyv = { version = "0.8.12", features = ["bytecheck"], optional = true }
byteorder = { version = "1.5.0", optional = true }
memmap2 = { version = "0.9.9", optional = true }

[lib]
path = "src/lib.rs"
